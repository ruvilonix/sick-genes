{% extends "sickgenes/base.html" %}

{% block title %}{{ symbol }}{% endblock %}

{% block content %}
<h1 class="page-title">{{ symbol }}</h1>
<p class="page-subtitle">{{ symbol }} is not a current gene symbol. It is a previous symbol of these genes:</p>

<ul class="list-group">
    {% for gene in genes %}
        <li class="list-group-item"><a href="{{ gene.get_absolute_url }}">{{ gene.symbol }}</a> <span class="text-muted">{{ gene.name }}</span></li>
    {% endfor %}
</ul>
{% endblock %}
