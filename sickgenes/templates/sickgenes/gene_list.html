{% extends 'sickgenes/base.html' %}
{% load render_table from django_tables2 %}

{% block title %}Browse Genes{% endblock %}

{% block content %}

<h1 class="page-title">Genes</h1>

<form method="get" class="row g-2 align-items-center mb-3">
    {% if filtered_genes %}
        <input type="hidden" name="symbol" value="{{ filtered_genes }}">
    {% endif %}
    {% if cohort_id %}
        <input type="hidden" name="cohort" value="{{ cohort_id }}">
    {% endif %}

    <div class="col-12 col-sm-auto">
        <label for="{{ form.phenotype.id_for_label }}" class="col-form-label">Phenotype</label>
    </div>
    <div class="col col-sm-auto">
        {{ form.phenotype }}
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary">Filter</button>
    </div>
</form>

{% render_table genes_table %}

{% endblock %}
