name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sickgenes
          POSTGRES_PASSWORD: sickgenes
          POSTGRES_DB: sickgenes
        ports:
          - 5432:5432
        # Wait until Postgres is ready before running the tests
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost 127.0.0.1
      DATABASE_URL: postgres://sickgenes:sickgenes@localhost:5432/sickgenes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Catch mistakes such as unused or undefined names (rules in pyproject.toml)
      - run: ruff check .

      # Fail if a model was changed without making a migration for it
      - run: python manage.py makemigrations --check

      - run: python manage.py test sickgenes
